# YDZ OS : Ollama. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434/tcp"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${MEMOIRE_MODELE}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ${YDZ_DATA}/models:/root/.ollama
