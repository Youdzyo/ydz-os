# YDZ OS : Vikunja. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  vikunja:
    image: vikunja/vikunja:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3456:3456/tcp"
    environment:
      TZ: ${YDZ_TZ}
      VIKUNJA_SERVICE_PUBLICURL: http://${YDZ_IP}:3456/
      VIKUNJA_SERVICE_JWTSECRET: ${CLE_JWT}
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    volumes:
      - ${YDZ_DATA}/db:/db
      - ${YDZ_DATA}/files:/app/vikunja/files
