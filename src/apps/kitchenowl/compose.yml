# YDZ OS : KitchenOwl. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  kitchenowl:
    image: tombursch/kitchenowl:latest
    restart: unless-stopped
    ports:
      - "8134:8080/tcp"
    environment:
      TZ: ${YDZ_TZ}
      JWT_SECRET_KEY: ${CLE_JWT}
      FRONT_URL: http://${YDZ_IP}:8134
    volumes:
      - ${YDZ_DATA}/data:/data
