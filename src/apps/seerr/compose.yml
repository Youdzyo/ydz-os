# YDZ OS : Seerr. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    init: true
    ports:
      - "5055:5055/tcp"
    environment:
      TZ: ${YDZ_TZ}
      LOG_LEVEL: info
    volumes:
      - ${YDZ_DATA}/config:/app/config
