# YDZ OS : Joplin Server. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${MDP_BASE}
      POSTGRES_DB: joplin
    volumes:
      - ${YDZ_DATA}/db:/var/lib/postgresql/data
  joplin:
    image: joplin/server:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "22300:22300/tcp"
    environment:
      APP_PORT: "22300"
      APP_BASE_URL: http://${YDZ_IP}:22300
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${MDP_BASE}
