# YDZ OS : Navidrome. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "4533:4533/tcp"
    environment:
      TZ: ${YDZ_TZ}
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
    volumes:
      - ${YDZ_DATA}/data:/data
      - ${MUSIQUE}:/music:ro
