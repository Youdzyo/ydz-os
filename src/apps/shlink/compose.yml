# YDZ OS : Shlink. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  shlink:
    image: shlinkio/shlink:stable
    restart: unless-stopped
    ports:
      - "8114:8080/tcp"
    environment:
      TZ: ${YDZ_TZ}
      DEFAULT_DOMAIN: ${YDZ_IP}:8114
      IS_HTTPS_ENABLED: "false"
      INITIAL_API_KEY: ${CLE_API}
    volumes:
      - ${YDZ_DATA}/data:/etc/shlink/data
  web:
    image: shlinkio/shlink-web-client:stable
    restart: unless-stopped
    depends_on:
      - shlink
    ports:
      - "8113:8080/tcp"
    environment:
      SHLINK_SERVER_URL: http://${YDZ_IP}:8114
      SHLINK_SERVER_API_KEY: ${CLE_API}
