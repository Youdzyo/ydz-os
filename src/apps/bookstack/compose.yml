# YDZ OS : BookStack. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MDP_BASE}
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${MDP_BASE}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ${YDZ_DATA}/db:/var/lib/mysql
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "export APP_KEY=base64:$$(printf %s $$CLE_1$$CLE_2 | head -c 32 | base64) && exec /init"]
    depends_on:
      - db
    ports:
      - "6875:80/tcp"
    environment:
      CLE_1: ${CLE_APP}
      CLE_2: ${CLE_APP2}
      PUID: "1000"
      PGID: "1000"
      TZ: ${YDZ_TZ}
      APP_URL: http://${YDZ_IP}:6875
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: bookstack
      DB_PASSWORD: ${MDP_BASE}
      DB_DATABASE: bookstack
    volumes:
      - ${YDZ_DATA}/config:/config
