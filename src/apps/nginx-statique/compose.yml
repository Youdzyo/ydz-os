# YDZ OS : Site statique (Nginx). Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "[ -f /usr/share/nginx/html/index.html ] || echo '<h1>Mon site YDZ</h1>' > /usr/share/nginx/html/index.html; exec nginx -g 'daemon off;'"]
    ports:
      - "8139:80/tcp"
    environment:
      TZ: ${YDZ_TZ}
    volumes:
      - ${YDZ_DATA}/html:/usr/share/nginx/html
