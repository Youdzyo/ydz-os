# YDZ OS : Calibre-Web. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    restart: unless-stopped
    ports:
      - "8083:8083/tcp"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${YDZ_TZ}
    volumes:
      - ${YDZ_DATA}/config:/config
      - ${LIVRES}:/books
