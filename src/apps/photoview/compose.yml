# YDZ OS : Photoview. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  photoview:
    image: photoview/photoview:2
    restart: unless-stopped
    ports:
      - "8100:80/tcp"
    environment:
      PHOTOVIEW_DATABASE_DRIVER: sqlite
      PHOTOVIEW_SQLITE_PATH: /home/photoview/database/photoview.db
      PHOTOVIEW_MEDIA_CACHE: /home/photoview/media-cache
      PHOTOVIEW_LISTEN_IP: 0.0.0.0
      PHOTOVIEW_LISTEN_PORT: "80"
    volumes:
      - ${YDZ_DATA}/cache:/home/photoview/media-cache
      - ${YDZ_DATA}/db:/home/photoview/database
      - ${PHOTOS}:/photos:ro
