# YDZ OS : Transmission. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    ports:
      - "9091:9091/tcp"
      - "51413:51413/tcp"
      - "51413:51413/udp"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${YDZ_TZ}
      USER: ${UTILISATEUR}
      PASS: ${MDP_WEB}
    volumes:
      - ${YDZ_DATA}/config:/config
      - ${TELECHARGEMENTS}:/downloads
