# YDZ OS : Frigate. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 30s
    ports:
      - "5110:8971/tcp"
      - "8554:8554/tcp"
    environment:
      TZ: ${YDZ_TZ}
    volumes:
      - ${YDZ_DATA}/config:/config
      - ${ENREGISTREMENTS}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
