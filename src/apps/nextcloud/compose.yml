# YDZ OS : Nextcloud. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: ${MDP_BASE}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${MDP_BASE}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ${YDZ_DATA}/db:/var/lib/mysql
  nextcloud:
    image: nextcloud:stable
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8088:80/tcp"
    environment:
      TZ: ${YDZ_TZ}
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MDP_BASE}
      NEXTCLOUD_ADMIN_USER: ${ADMIN}
      NEXTCLOUD_ADMIN_PASSWORD: ${MDP_ADMIN}
      NEXTCLOUD_TRUSTED_DOMAINS: ${YDZ_HOTE}.local ${YDZ_HOTE} ${YDZ_IP}
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 4G
    volumes:
      - ${YDZ_DATA}/html:/var/www/html
