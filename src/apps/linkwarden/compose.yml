# YDZ OS : Linkwarden. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${MDP_BASE}
      POSTGRES_DB: linkwarden
    volumes:
      - ${YDZ_DATA}/db:/var/lib/postgresql/data
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3015:3000/tcp"
    environment:
      DATABASE_URL: postgresql://linkwarden:${MDP_BASE}@db:5432/linkwarden
      NEXTAUTH_SECRET: ${CLE_SECRETE}
      NEXTAUTH_URL: http://${YDZ_IP}:3015/api/v1/auth
    volumes:
      - ${YDZ_DATA}/data:/data/data
