# YDZ OS : Plex. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  plex:
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    ports:
      - "32400:32400/tcp"
    environment:
      TZ: ${YDZ_TZ}
      PLEX_UID: "1000"
      PLEX_GID: "1000"
      PLEX_CLAIM: ${PLEX_CLAIM}
      ADVERTISE_IP: http://${YDZ_IP}:32400/
    volumes:
      - ${YDZ_DATA}/config:/config
      - ${YDZ_DATA}/transcode:/transcode
      - ${MEDIAS}:/data:ro
