# YDZ OS : Karakeep. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  chrome:
    image: zenika/alpine-chrome:124
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${CLE_RECHERCHE}
    volumes:
      - ${YDZ_DATA}/meili:/meili_data
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    restart: unless-stopped
    depends_on:
      - chrome
      - meilisearch
    ports:
      - "3016:3000/tcp"
    environment:
      DATA_DIR: /data
      NEXTAUTH_SECRET: ${CLE_SECRETE}
      NEXTAUTH_URL: http://${YDZ_IP}:3016
      MEILI_ADDR: http://meilisearch:7700
      MEILI_MASTER_KEY: ${CLE_RECHERCHE}
      BROWSER_WEB_URL: http://chrome:9222
    volumes:
      - ${YDZ_DATA}/data:/data
