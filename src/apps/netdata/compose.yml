# YDZ OS : Netdata. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  netdata:
    image: netdata/netdata:stable
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    ports:
      - "19999:19999/tcp"
    environment:
      TZ: ${YDZ_TZ}
      DO_NOT_TRACK: "1"
    volumes:
      - ${YDZ_DATA}/config:/etc/netdata
      - ${YDZ_DATA}/lib:/var/lib/netdata
      - ${YDZ_DATA}/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
