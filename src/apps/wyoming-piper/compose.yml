# YDZ OS : Piper (texte en voix). Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  piper:
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    command: --voice ${VOIX}
    ports:
      - "10200:10200/tcp"
    environment:
      TZ: ${YDZ_TZ}
    volumes:
      - ${YDZ_DATA}/data:/data
