# YDZ OS : Node-RED. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  node-red:
    image: nodered/node-red:latest
    restart: unless-stopped
    user: "0:0"
    ports:
      - "1880:1880/tcp"
    environment:
      TZ: ${YDZ_TZ}
    volumes:
      - ${YDZ_DATA}/data:/data
