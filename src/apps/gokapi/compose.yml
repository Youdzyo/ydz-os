# YDZ OS : Gokapi. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  gokapi:
    image: f0rc3/gokapi:latest
    restart: unless-stopped
    ports:
      - "53842:53842/tcp"
    environment:
      TZ: ${YDZ_TZ}
    volumes:
      - ${YDZ_DATA}/data:/app/data
      - ${YDZ_DATA}/config:/app/config
