# YDZ OS : Miniflux. Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${MDP_BASE}
      POSTGRES_DB: miniflux
    volumes:
      - ${YDZ_DATA}/db:/var/lib/postgresql/data
  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8131:8080/tcp"
    environment:
      DATABASE_URL: postgres://miniflux:${MDP_BASE}@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${ADMIN}
      ADMIN_PASSWORD: ${MDP_ADMIN}
      BASE_URL: http://${YDZ_IP}:8131/
