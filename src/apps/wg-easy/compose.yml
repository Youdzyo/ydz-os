# YDZ OS : WireGuard (wg-easy). Les variables ${...} viennent du fichier .env écrit par l'agent.
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
    volumes:
      - ${YDZ_DATA}/etc-wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
