<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Home Pi Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="enveloppe">
    <header class="tete">
      <span class="logo" aria-hidden="true">HPL</span>
      <div class="tete-textes">
        <h1 id="labo">Home Pi Lab</h1>
        <p class="sous">Les serveurs de jeu, en direct</p>
      </div>
      <span class="etat-tour" id="etat-tour" title="État de la tour">
        <i class="point" id="point-tour"></i><span id="texte-tour">…</span>
      </span>
    </header>

    <section id="jeux" class="jeux" aria-live="polite"></section>

    <section class="creer">
      <div class="creer-textes">
        <h2>Créer un serveur</h2>
        <p>Lance ton propre serveur de jeu en un clic.</p>
      </div>
      <button type="button" class="btn-creer" disabled aria-disabled="true">
        <span>Créer un serveur</span><span class="badge">Bientôt</span>
      </button>
    </section>
    <p class="note-bientot">Cette fonction arrive bientôt.</p>

    <footer class="pied">
      <span id="chaleur"></span>
      <span id="horloge"></span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
